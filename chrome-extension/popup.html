<!DOCTYPE html>
<html>
<meta charset="UTF-8">
<head>
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    #stateOutput {
      width: 100%;
      height: 300px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-y: auto;
    }
    button {
      margin: 10px 0;
      padding: 10px;
      background-color: #3b82f6;
      color: white;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #2563eb;
    }
    .status {
      margin: 10px 0;
      padding: 10px;
      border-radius: 4px;
    }
    .success {
      background-color: #dff0d8;
      color: #3c763d;
    }
    .error {
      background-color: #f2dede;
      color: #a94442;
    }
  </style>
</head>
<body>
  <h2>闲鱼 Chrome 采集</h2>
  <p id="nativeStatus" role="status">正在检查连接…</p>
  <button id="openNativeOptions">采集连接设置</button>
  <button id="resumeNative" disabled>完成登录 / 验证后继续</button>
  <details>
  <summary>导出登录状态</summary>
  <button id="extractBtn">1.点击获取环境+登录状态</button>
  <div id="status"></div>
  <textarea id="stateOutput" readonly></textarea>
  <button id="copyBtn">2.点击复制</button>
  </details>

  <script src="popup.js"></script>
  <script src="native-popup.js"></script>
</body>
</html>
