<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>闲鱼 Chrome 采集设置</title>
<link rel="stylesheet" href="options.css">
<body>
  <main>
    <h1>Chrome 采集设置</h1>
    <p>连接本机闲鱼监控服务。采集会使用当前 Chrome profile 中已登录的账号。</p>
    <form id="settings">
      <label>本机服务地址<input id="endpoint" value="http://127.0.0.1:8000" required></label>
      <label>配对令牌<input id="token" type="password" autocomplete="off" required></label>
      <p>在蓝色管理界面的「系统设置 → Chrome 采集」中获取令牌。</p>
      <label>浏览器名称<input id="name" value="本机 Chrome" maxlength="100" required></label>
      <label>绑定账号文件（可选）<input id="account" placeholder="例如 state/my-account.json"></label>
      <p>固定账号任务按此名称选择 Chrome profile。只填写账号管理中的路径，不会导入或切换 cookies。</p>
      <label class="toggle"><input id="enabled" type="checkbox">启用后台采集连接</label>
      <button>保存并连接</button>
    </form>
    <p id="status" role="status"></p>
    <p>遇到登录或安全验证时会恢复采集窗口，请完成处理后在扩展弹窗中点击「继续」。</p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
